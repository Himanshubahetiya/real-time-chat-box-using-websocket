<script>

/* =========================================================
   AUTH
========================================================= */

const token = localStorage.getItem("token");

if (!token) {
    window.location = "/static/auth.html";
}


/* =========================================================
   DECODE JWT
========================================================= */

let payload;

try {

    payload = JSON.parse(
        atob(token.split(".")[1])
    );

}
catch (error) {

    console.error("Invalid token");

    localStorage.removeItem("token");

    window.location = "/static/auth.html";
}


/* =========================================================
   CURRENT USER
========================================================= */

const myName = payload.username;


/*
    selectedUser = null
        ↓
    GROUP CHAT

    selectedUser = "Rahul"
        ↓
    PRIVATE CHAT WITH RAHUL
*/

let selectedUser = null;


/* =========================================================
   DOM
========================================================= */

const users =
    document.getElementById("users");

const chat =
    document.getElementById("chat");

const msg =
    document.getElementById("msg");

const typing =
    document.getElementById("typing");

const privateHeader =
    document.getElementById("private-header");

const privateUserName =
    document.getElementById(
        "private-user-name"
    );

const mainTitle =
    document.getElementById(
        "main-title"
    );


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");
}


/* =========================================================
   SCROLL
========================================================= */

function scrollChat() {

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   IMAGE RENDER
========================================================= */

function renderImage(
    url,
    sender,
    isMine = false
) {

    return `

        <div
            class="message-row ${
                isMine
                    ? "message-right"
                    : "message-left"
            }"
        >

            <div class="message-bubble">

                <span class="message-sender">

                    ${
                        isMine
                            ? "You"
                            : escapeHtml(sender)
                    }

                </span>

                <br>

                <img

                    src="${escapeHtml(url)}"

                    width="150"

                    style="
                        max-width: 250px;
                        max-height: 300px;
                        border-radius: 10px;
                        margin-top: 5px;
                        cursor: pointer;
                        object-fit: contain;
                    "

                    onclick="
                        window.open(
                            this.src,
                            '_blank'
                        )
                    "

                >

            </div>

        </div>

    `;
}


/* =========================================================
   LOAD PUBLIC / GROUP MESSAGES
========================================================= */

async function loadMessages() {

    try {

        /*
            If private chat is open,
            don't load group messages.
        */

        if (
            selectedUser !== null
        ) {

            return;

        }


        const response =
            await fetch(
                "/messages"
            );


        if (!response.ok) {

            console.log(
                "Failed to load messages"
            );

            return;

        }


        const messages =
            await response.json();


        chat.innerHTML = "";


        messages.forEach(
            message => {

                /*
                    GROUP CHAT ONLY

                    receiver must be NULL.
                */

                if (
                    message.receiver !== null &&
                    message.receiver !== undefined
                ) {

                    return;

                }


                /* =====================================
                   PUBLIC TEXT
                ===================================== */

                if (
                    message.message_type === "text"
                ) {

                    chat.innerHTML += `

                        <p>

                            <b>
                                ${escapeHtml(
                                    message.sender
                                )}
                            </b>

                            ${escapeHtml(
                                message.message
                            )}

                        </p>

                    `;

                    return;

                }


                /* =====================================
                   PUBLIC IMAGE
                ===================================== */

                if (
                    message.message_type === "image"
                ) {

                    chat.innerHTML +=
                        renderImage(

                            message.message,

                            message.sender,

                            message.sender === myName

                        );

                    return;

                }

            }
        );


        scrollChat();

    }

    catch (error) {

        console.log(
            "Error loading messages:",
            error
        );

    }

}


/* =========================================================
   LOAD PRIVATE MESSAGES
========================================================= */

async function loadPrivateMessages(
    username
) {

    try {

        /*
            current_user = logged in user

            username = selected user
        */

        const response =
            await fetch(

                `/private-messages/${
                    encodeURIComponent(username)
                }?current_user=${
                    encodeURIComponent(myName)
                }`

            );


        if (!response.ok) {

            console.log(
                "Failed to load private messages"
            );

            return;

        }


        const messages =
            await response.json();


        /*
            User may have switched
            chat while request was running.
        */

        if (
            selectedUser !== username
        ) {

            return;

        }


        chat.innerHTML = "";


        messages.forEach(
            message => {

                /*
                    EXACT PRIVATE CONVERSATION

                    Himanshu -> Rahul
                    Rahul   -> Himanshu

                    Other conversations
                    are ignored.
                */

                const validConversation =

                    (

                        message.sender === myName &&

                        message.receiver === username

                    )

                    ||

                    (

                        message.sender === username &&

                        message.receiver === myName

                    );


                if (
                    !validConversation
                ) {

                    return;

                }


                /* =====================================
                   PRIVATE TEXT
                ===================================== */

                if (
                    message.message_type === "private"
                ) {

                    /*
                        MY MESSAGE
                    */

                    if (
                        message.sender === myName
                    ) {

                        chat.innerHTML += `

                            <div
                                class="message-row message-right"
                            >

                                <div
                                    class="message-bubble"
                                >

                                    <span
                                        class="message-sender"
                                    >
                                        You
                                    </span>

                                    <span
                                        class="message-text"
                                    >
                                        ${escapeHtml(
                                            message.message
                                        )}
                                    </span>

                                </div>

                            </div>

                        `;

                    }


                    /*
                        OTHER USER MESSAGE
                    */

                    else {

                        chat.innerHTML += `

                            <div
                                class="message-row message-left"
                            >

                                <div
                                    class="message-bubble"
                                >

                                    <span
                                        class="message-sender"
                                    >
                                        ${escapeHtml(
                                            message.sender
                                        )}
                                    </span>

                                    <span
                                        class="message-text"
                                    >
                                        ${escapeHtml(
                                            message.message
                                        )}
                                    </span>

                                </div>

                            </div>

                        `;

                    }


                    return;

                }


                /* =====================================
                   PRIVATE IMAGE
                ===================================== */

                if (
                    message.message_type ===
                    "private_image"
                ) {

                    chat.innerHTML +=
                        renderImage(

                            message.message,

                            message.sender,

                            message.sender === myName

                        );

                    return;

                }

            }
        );


        scrollChat();

    }

    catch (error) {

        console.log(
            "Error loading private messages:",
            error
        );

    }

}


/* =========================================================
   OPEN PRIVATE CHAT
========================================================= */

async function openPrivateChat(
    username
) {

    /*
        Don't allow own chat.
    */

    if (
        username === myName
    ) {

        return;

    }


    /*
        Set selected user.
    */

    selectedUser =
        username;


    /*
        Change title.
    */

    mainTitle.innerText =
        "Private Chat";


    /*
        Show username.
    */

    privateUserName.innerText =
        username;


    /*
        Show private header.
    */

    privateHeader.style.display =
        "flex";


    /*
        Hide online users.
    */

    document
        .querySelector(".users-bar")
        .style.display =
        "none";


    /*
        Clear typing.
    */

    typing.innerText = "";


    /*
        Clear old messages.
    */

    chat.innerHTML = "";


    /*
        Load ONLY selected
        user's conversation.
    */

    await loadPrivateMessages(
        username
    );


    msg.focus();

}


/* =========================================================
   BACK TO PUBLIC
========================================================= */

async function backToPublic() {

    /*
        Group mode.
    */

    selectedUser = null;


    /*
        Change title.
    */

    mainTitle.innerText =
        "Realtime Chat";


    /*
        Hide private header.
    */

    privateHeader.style.display =
        "none";


    /*
        Show users.
    */

    document
        .querySelector(".users-bar")
        .style.display =
        "flex";


    /*
        Clear typing.
    */

    typing.innerText = "";


    /*
        Clear private messages.
    */

    chat.innerHTML = "";


    /*
        Load group messages.
    */

    await loadMessages();


    msg.focus();

}


/* =========================================================
   WEBSOCKET
========================================================= */

// const ws =
//     new WebSocket(

//         `ws://${location.hostname}:8000/ws?token=${
//             encodeURIComponent(token)
//         }`

//     );

const protocol = location.protocol === "https:" ? "wss:" : "ws:";

const ws = new WebSocket(
    `${protocol}//${location.host}/ws?token=${encodeURIComponent(token)}`
);

/* =========================================================
   INITIAL PUBLIC LOAD
========================================================= */

loadMessages();


/* =========================================================
   WEBSOCKET OPEN
========================================================= */

ws.onopen = () => {

    console.log(
        "WebSocket connected"
    );

};


/* =========================================================
   WEBSOCKET CLOSE
========================================================= */

ws.onclose = () => {

    console.log(
        "WebSocket closed"
    );

};


/* =========================================================
   WEBSOCKET ERROR
========================================================= */

ws.onerror = error => {

    console.error(
        "WebSocket error:",
        error
    );

};


/* =========================================================
   RECEIVE MESSAGE
========================================================= */

ws.onmessage = e => {

    const data =
        JSON.parse(e.data);


    /* =====================================================
       ONLINE USERS
    ===================================================== */

    if (
        data.type === "users"
    ) {

        users.innerHTML = "";


        data.users.forEach(
            username => {

                /*
                    Don't show myself.
                */

                if (
                    username === myName
                ) {

                    return;

                }


                const li =
                    document.createElement(
                        "li"
                    );


                li.innerHTML =
                    `👤 ${
                        escapeHtml(username)
                    }`;


                li.onclick =
                    () => {

                        openPrivateChat(
                            username
                        );

                    };


                users.appendChild(
                    li
                );

            }
        );


        return;

    }


    /* =====================================================
       TYPING
    ===================================================== */

    if (
        data.type === "typing"
    ) {

        /*
            GROUP TYPING
        */

        if (
            selectedUser === null
        ) {

            if (
                data.user !== myName
            ) {

                typing.innerText =
                    `${
                        escapeHtml(
                            data.user
                        )
                    } is typing...`;

            }

        }


        /*
            PRIVATE TYPING

            Only selected user.
        */

        else if (
            data.user === selectedUser
        ) {

            typing.innerText =
                `${
                    escapeHtml(
                        data.user
                    )
                } is typing...`;

        }


        setTimeout(
            () => {

                typing.innerText = "";

            },
            1000
        );


        return;

    }


    /* =====================================================
       PUBLIC TEXT MESSAGE
    ===================================================== */

    if (
        data.type === "message"
    ) {

        /*
            IMPORTANT:

            If private chat is open,
            DON'T show group message.
        */

        if (
            selectedUser !== null
        ) {

            return;

        }


        chat.innerHTML += `

            <p>

                <b>
                    ${escapeHtml(
                        data.user
                    )}
                </b>

                ${escapeHtml(
                    data.text
                )}

            </p>

        `;


        scrollChat();


        return;

    }


    /* =====================================================
       PRIVATE TEXT MESSAGE
    ===================================================== */

    if (
        data.type === "private"
    ) {

        /*
            Private message must
            NEVER appear in group chat.
        */

        if (
            selectedUser === null
        ) {

            return;

        }


        /*
            EXACT CONVERSATION CHECK
        */

        const isMyConversation =

            (

                data.from === myName &&

                data.to === selectedUser

            )

            ||

            (

                data.from === selectedUser &&

                data.to === myName

            );


        if (
            !isMyConversation
        ) {

            return;

        }


        /*
            Sender already rendered
            message locally.

            So don't duplicate.
        */

        if (
            data.from === myName
        ) {

            return;

        }


        /*
            Receiver gets message.
        */

        chat.innerHTML += `

            <div
                class="message-row message-left"
            >

                <div
                    class="message-bubble"
                >

                    <span
                        class="message-sender"
                    >
                        ${escapeHtml(
                            data.from
                        )}
                    </span>

                    <span
                        class="message-text"
                    >
                        ${escapeHtml(
                            data.text
                        )}
                    </span>

                </div>

            </div>

        `;


        scrollChat();


        return;

    }


    /* =====================================================
       PUBLIC IMAGE
    ===================================================== */

    if (
        data.type === "image"
    ) {

        /*
            Public image belongs
            ONLY to group chat.
        */

        if (
            selectedUser !== null
        ) {

            return;

        }


        chat.innerHTML +=
            renderImage(

                data.data,

                data.user,

                data.user === myName

            );


        scrollChat();


        return;

    }


    /* =====================================================
       PRIVATE IMAGE
    ===================================================== */

    if (
        data.type === "private_image"
    ) {

        /*
            NEVER show private image
            in group chat.
        */

        if (
            selectedUser === null
        ) {

            return;

        }


        /*
            EXACT PRIVATE CONVERSATION

            Himanshu -> Rahul
            Rahul   -> Himanshu

            Only these are allowed.
        */

        const isMyConversation =

            (

                data.from === myName &&

                data.to === selectedUser

            )

            ||

            (

                data.from === selectedUser &&

                data.to === myName

            );


        if (
            !isMyConversation
        ) {

            return;

        }


        /*
            Sender already rendered
            image locally.

            Don't duplicate.
        */

        if (
            data.from === myName
        ) {

            return;

        }


        /*
            Receiver gets private image.
        */

        chat.innerHTML +=
            renderImage(

                data.data,

                data.from,

                false

            );


        scrollChat();


        return;

    }

};


/* =========================================================
   SEND TEXT MESSAGE
========================================================= */

function send() {

    const text =
        msg.value.trim();


    if (!text) {

        return;

    }


    /*
        WebSocket check.
    */

    if (
        ws.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "Connection lost. Refresh page."
        );

        return;

    }


    /* =====================================================
       PRIVATE MESSAGE
    ===================================================== */

    if (
        selectedUser !== null
    ) {

        ws.send(
            JSON.stringify({

                type: "private",

                to: selectedUser,

                data: text

            })
        );


        /*
            Show my message immediately
            ONLY in private chat.
        */

        chat.innerHTML += `

            <div
                class="message-row message-right"
            >

                <div
                    class="message-bubble"
                >

                    <span
                        class="message-sender"
                    >
                        You
                    </span>

                    <span
                        class="message-text"
                    >
                        ${escapeHtml(
                            text
                        )}
                    </span>

                </div>

            </div>

        `;


        scrollChat();

    }


    /* =====================================================
       PUBLIC MESSAGE
    ===================================================== */

    else {

        ws.send(
            JSON.stringify({

                type: "message",

                data: text

            })
        );

    }


    msg.value = "";

}


/* =========================================================
   TYPING
========================================================= */

msg.addEventListener(
    "input",
    () => {

        if (
            ws.readyState !==
            WebSocket.OPEN
        ) {

            return;

        }


        /*
            PRIVATE TYPING
        */

        if (
            selectedUser !== null
        ) {

            ws.send(
                JSON.stringify({

                    type: "typing",

                    to: selectedUser

                })
            );

        }


        /*
            GROUP TYPING
        */

        else {

            ws.send(
                JSON.stringify({

                    type: "typing"

                })
            );

        }

    }
);


/* =========================================================
   ENTER TO SEND
========================================================= */

msg.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "Enter"
        ) {

            e.preventDefault();

            send();

        }

    }
);


/* =========================================================
   SEND IMAGE
========================================================= */

function sendImage(input) {

    const file =
        input.files[0];


    if (!file) {

        return;

    }


    /*
        Only images.
    */

    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        alert(
            "Please select an image."
        );

        input.value = "";

        return;

    }


    /*
        WebSocket check.
    */

    if (
        ws.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "Connection lost. Refresh page."
        );

        input.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload = () => {


        /* =================================================
           PRIVATE IMAGE
        ================================================= */

        if (
            selectedUser !== null
        ) {

            /*
                IMPORTANT:

                private_image

                NOT

                image

                because image is public.
            */

            ws.send(
                JSON.stringify({

                    type: "private_image",

                    to: selectedUser,

                    data: reader.result

                })
            );


            /*
                Show my image immediately
                ONLY in private chat.
            */

            chat.innerHTML +=
                renderImage(

                    reader.result,

                    myName,

                    true

                );


            scrollChat();

        }


        /* =================================================
           PUBLIC IMAGE
        ================================================= */

        else {

            ws.send(
                JSON.stringify({

                    type: "image",

                    data: reader.result

                })
            );

        }

    };


    reader.readAsDataURL(file);


    /*
        Reset file input.
    */

    input.value = "";

}


/* =========================================================
   LOGOUT
========================================================= */

function logout() {

    if (
        ws &&
        ws.readyState ===
        WebSocket.OPEN
    ) {

        ws.close();

    }


    localStorage.removeItem(
        "token"
    );


    window.location =
        "/static/auth.html";

}

</script>
